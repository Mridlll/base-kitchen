<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Base Kitchen</title>
<script>
  // GitHub Pages serves this for unknown paths. Send people to the game, keeping ?room=CODE.
  (function () {
    var parts = location.pathname.split("/").filter(Boolean);
    var base = location.hostname.endsWith("github.io") && parts.length ? "/" + parts[0] + "/" : "/";
    location.replace(base + location.search + location.hash);
  })();
</script>
</head>
<body><p><a href="./">Go to Base Kitchen</a></p></body>
</html>
