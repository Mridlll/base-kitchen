<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Base Kitchen: a behavioural science capstone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --ink:#000000; --forest:#1E4D2B; --leaf:#3E8E41; --sprout:#A8D5A2;
  --mist:#EEF6EC; --muted:#4A5A4C; --line:#CFE3C9; --on-ink:#FFFFFF;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#000000; --ink:#FFFFFF; --forest:#A8D5A2; --leaf:#6CC06F; --sprout:#2E5E34;
    --mist:#0D1A0F; --muted:#B5C7B7; --line:#3A6B44; --on-ink:#000000;
  }
}
:root[data-theme="dark"]{
  --paper:#000000; --ink:#FFFFFF; --forest:#A8D5A2; --leaf:#6CC06F; --sprout:#2E5E34;
  --mist:#0D1A0F; --muted:#B5C7B7; --line:#3A6B44; --on-ink:#000000;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:3px;border-radius:6px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--ink)}
.top-inner{max-width:880px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.mark{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.mark small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:2px}
.thali{flex:1;display:flex;justify-content:center}
.thali svg{height:46px;width:auto;overflow:visible}
.katori-fill{transform-origin:center;transform:scale(0);transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.katori.done .katori-fill{transform:scale(1)}
.katori.now circle.rim{stroke:var(--leaf);stroke-width:3}
.score-chip{font-family:var(--display);font-weight:700;font-size:18px;border:2px solid var(--ink);border-radius:999px;padding:2px 14px;white-space:nowrap}
.score-chip span{display:inline-block}
.score-chip.bump span{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.35)}}

/* Stage */
main{max-width:760px;margin:0 auto;padding:28px 20px 200px}
.act-tag{font-family:var(--display);font-weight:700;color:var(--leaf);font-size:17px;margin:0 0 2px}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.05;letter-spacing:-.015em;margin:0 0 12px}
h1{font-size:clamp(44px,9vw,76px)}
h2{font-size:clamp(30px,5.5vw,42px)}
h3{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.2;margin:26px 0 8px}
p{margin:0 0 14px;max-width:64ch}
.lede{font-size:19px;color:var(--muted)}
.brief{border-left:6px solid var(--leaf);background:var(--mist);padding:14px 18px;border-radius:0 14px 14px 0;margin:18px 0}
.brief p:last-child{margin:0}
.meta{font-size:14px;color:var(--muted)}

/* Buttons */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.btn{appearance:none;border:2px solid var(--ink);background:var(--ink);color:var(--on-ink);font-family:var(--display);font-weight:700;font-size:18px;padding:8px 22px 6px;border-radius:999px;cursor:pointer;transition:transform .12s ease, background .15s}
.btn:hover{background:var(--forest);border-color:var(--forest)}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--mist)}

/* Chips */
.group{border:2px solid var(--line);border-radius:18px;margin:16px 0;overflow:hidden;background:var(--paper);transition:border-color .2s}
.group.answered{border-color:var(--ink)}
.group-q{display:flex;align-items:center;gap:12px;background:var(--mist);border-bottom:2px solid var(--line);padding:10px 16px;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2}
.group.answered .group-q{border-bottom-color:var(--ink)}
.gnum{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:15px;background:var(--paper);transition:background .2s,color .2s}
.group.answered .gnum{background:var(--leaf);border-color:var(--leaf);color:var(--on-ink)}
.gstat{margin-left:auto;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);white-space:nowrap}
.group.answered .gstat{color:var(--leaf);font-weight:700}
.group .chips{padding:14px 16px}
.group .why-slot:not(:empty){padding:0 16px 14px}
.group .why{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{max-width:100%;overflow-wrap:anywhere;appearance:none;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 14px;cursor:pointer;text-align:left;line-height:1.35;transition:border-color .15s, background .15s, transform .12s}
.chip:hover{border-color:var(--leaf)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--mist);box-shadow:3px 3px 0 var(--ink)}
.chip.right{border-color:var(--leaf);background:var(--mist);box-shadow:3px 3px 0 var(--leaf)}
.chip.wrong{border-color:var(--ink);background:repeating-linear-gradient(-45deg,var(--paper) 0 6px,var(--mist) 6px 12px)}
.why{font-size:15px;color:var(--muted);margin:8px 0 0;padding-left:12px;border-left:3px solid var(--sprout)}
.why b{color:var(--ink)}

/* Spec sentence */
.spec{font-family:var(--display);font-size:clamp(20px,3.4vw,26px);line-height:1.35;font-weight:500;border:2px solid var(--ink);border-radius:18px;padding:16px 20px;margin:12px 0 4px}
.spec-label{font-weight:700;margin:18px 0 0}
.spec-label span{font-weight:400;color:var(--muted);font-size:15px}
.slot{display:inline-block;border:2px dashed var(--muted);border-radius:10px;color:var(--muted);padding:0 8px;font-size:.8em;line-height:1.5;vertical-align:.08em;font-weight:500}
.slot.filled{display:inline;border:0;border-bottom:3px solid var(--leaf);border-radius:0;padding:0 2px;font-size:1em;color:var(--ink);font-weight:700;vertical-align:baseline}

/* Evidence sorting */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:14px 0}
.ecard{appearance:none;text-align:left;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--paper);cursor:pointer;font-size:15px;line-height:1.4;transition:transform .15s, border-color .15s}
.ecard:hover{border-color:var(--leaf)}
.ecard.sel{border-color:var(--ink);transform:rotate(-1.2deg) translateY(-3px);box-shadow:4px 4px 0 var(--leaf)}
.ecard .src{display:block;font-size:13px;color:var(--leaf);font-weight:700;margin-bottom:3px}
.ecard .src.none{color:var(--muted);font-style:italic;font-weight:400}
.bins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bin{border:2px dashed var(--muted);border-radius:16px;padding:10px;min-height:86px;cursor:pointer;transition:background .15s,border-color .15s;background:var(--paper)}
.bin.armed{border-color:var(--leaf);background:var(--mist);border-style:solid}
.bin-h{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.15}
.bin-h small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.bin.trash{grid-column:1/-1;border-color:var(--ink)}
.placed{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pchip{appearance:none;font-size:13px;border:1.5px solid var(--ink);background:var(--paper);border-radius:10px;padding:3px 8px;cursor:pointer;max-width:100%;text-align:left;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.pchip.right{border-color:var(--leaf);background:var(--mist)}
.pchip.wrong{text-decoration:line-through;text-decoration-color:var(--ink)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.col-label{font-weight:700;margin:16px 0 6px}

/* Sliders / forecast */
.fc{border:2px solid var(--ink);border-radius:18px;padding:16px 18px;margin:16px 0}
.fc h3{margin-top:0}
input[type=range]{width:100%;accent-color:var(--leaf);height:28px}
.fc-read{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:700}
.fc-read .big{font-size:30px}
.reveal-bar{position:relative;height:34px;border-radius:10px;background:var(--mist);margin:10px 0 4px;overflow:hidden}
.reveal-bar .tick{position:absolute;top:0;bottom:0;width:4px;border-radius:2px}
.tick.you{background:var(--ink)}
.tick.truth{background:var(--leaf);width:8px;transform:scaleY(0);transform-origin:bottom;animation:grow .7s .15s forwards cubic-bezier(.3,1.5,.5,1)}
@keyframes grow{to{transform:scaleY(1)}}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}

/* Levers */
.budget{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:5;background:var(--paper);padding:10px 0;border-bottom:2px solid var(--line)}
.budget-bar{height:18px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-top:6px}
.budget-fill{height:100%;background:var(--leaf);transition:width .35s cubic-bezier(.3,1.3,.5,1)}
.budget-fill.over{background:repeating-linear-gradient(-45deg,var(--ink) 0 8px,var(--forest) 8px 16px)}
.levers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
.lever{appearance:none;text-align:left;border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--paper);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.lever:hover{border-color:var(--leaf)}
.lever[aria-pressed="true"]{border-color:var(--ink);background:var(--mist);box-shadow:4px 4px 0 var(--ink);transform:translateY(-2px)}
.lever b{font-family:var(--display);font-size:18px;line-height:1.15}
.lever .tags{display:flex;flex-wrap:wrap;gap:4px}
.tagp{font-size:12px;border:1.5px solid var(--leaf);color:var(--forest);border-radius:999px;padding:0 8px}
.lever .cost{font-family:var(--display);font-weight:700;margin-top:auto}

/* Results */
.panel{border:2px solid var(--ink);border-radius:20px;padding:18px;margin:18px 0}
.headline-num{font-family:var(--display);font-weight:800;font-size:clamp(46px,10vw,72px);line-height:1;color:var(--forest)}
.hbar{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;margin:8px 0}
.hbar .lab{font-size:14px;line-height:1.2}
.hbar .track{height:26px;background:var(--mist);border-radius:8px;overflow:hidden}
.hbar .fill{height:100%;width:0;border-radius:8px;transition:width 1s cubic-bezier(.3,1.2,.5,1)}
.hbar .val{font-family:var(--display);font-weight:700;text-align:right}
.fill.ink{background:var(--ink)} .fill.leaf{background:var(--leaf)}
.waterfall{list-style:none;padding:0;margin:10px 0 0}
.waterfall li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.waterfall li b{font-family:var(--display);white-space:nowrap}
.plot-wrap{overflow-x:auto}
.checklist{list-style:none;padding:0;margin:8px 0}
.checklist li{padding:4px 0 4px 30px;position:relative}
.checklist li::before{content:"";position:absolute;left:0;top:7px;width:18px;height:18px;border:2px solid var(--ink);border-radius:5px}
.checklist li.ok::before{background:var(--leaf);border-color:var(--leaf)}
.checklist li.ok::after{content:"";position:absolute;left:6px;top:9px;width:6px;height:11px;border:solid var(--on-ink);border-width:0 3px 3px 0;transform:rotate(45deg)}

/* Pub bias */
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--paper);padding:6px 14px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.pb-stats{display:flex;flex-wrap:wrap;gap:24px;margin-top:10px}
.pb-stats div{font-size:14px;color:var(--muted)}
.pb-stats b{display:block;font-family:var(--display);font-size:30px;color:var(--ink);line-height:1.1}

/* Phone mock */
.phone-wrap{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;margin-top:14px}
.phone{width:300px;max-width:100%;border:3px solid var(--ink);border-radius:34px;padding:16px 14px 20px;background:var(--paper);flex-shrink:0}
.phone-notch{width:90px;height:8px;background:var(--ink);border-radius:8px;margin:0 auto 12px}
.app-h{font-family:var(--display);font-weight:800;font-size:22px;display:flex;justify-content:space-between;align-items:center}
.app-h span{font-size:13px;font-family:var(--body);font-weight:400;color:var(--muted)}
.pel{appearance:none;display:block;width:100%;text-align:left;border:2px dashed var(--line);border-radius:12px;padding:9px 10px;margin:8px 0;background:var(--paper);cursor:pointer;font-size:14px;line-height:1.35;position:relative}
.pel:hover{border-color:var(--leaf)}
.pel.sel{border-style:solid;border-color:var(--ink)}
.pel .lbl{position:absolute;right:-6px;top:-10px;font-size:11px;font-weight:700;background:var(--ink);color:var(--on-ink);border-radius:999px;padding:1px 8px;animation:pop .3s}
.pel.right .lbl{background:var(--leaf)}
.pel.wrong .lbl{text-decoration:line-through}
.cartline{display:flex;justify-content:space-between;font-size:14px;padding:4px 2px}
.fake-btn{margin-top:10px;background:var(--ink);color:var(--on-ink);text-align:center;border-radius:12px;padding:10px;font-family:var(--display);font-weight:700}
.picker{flex:1;min-width:230px}

/* Pitch */
.aud{border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:14px 0}
.aud h3{margin:0 0 4px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;cursor:pointer;border:2px solid transparent;margin:4px 0}
.opt:hover{background:var(--mist)}
.opt input{accent-color:var(--leaf);margin-top:5px;flex-shrink:0;width:18px;height:18px}
.opt.right{border-color:var(--leaf);background:var(--mist)}
.opt.wrong{border-color:var(--ink)}

/* Ragi */
.ragi{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:flex-end;gap:8px;max-width:min(430px,calc(100vw - 32px));pointer-events:none}
.bubble{pointer-events:auto;background:var(--paper);border:2px solid var(--ink);border-radius:18px 18px 4px 18px;padding:12px 14px 10px;font-size:15px;line-height:1.45;box-shadow:4px 4px 0 var(--leaf);transform-origin:bottom right;transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .2s}
.bubble.hide{transform:scale(.6);opacity:0;pointer-events:none}
.bubble .who{font-family:var(--display);font-weight:700;color:var(--leaf);font-size:14px}
.bubble-actions{display:flex;gap:6px;margin-top:8px}
.mini{appearance:none;border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;cursor:pointer}
.mini:hover{background:var(--mist)}
.ragi-body{pointer-events:auto;appearance:none;border:0;background:none;padding:0;cursor:pointer;width:84px;height:104px;flex-shrink:0}
.ragi-body svg{width:100%;height:100%;overflow:visible}
.ragi-bob{animation:bob 2.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
.ragi.happy .ragi-bob{animation:hop .6s cubic-bezier(.3,1.6,.5,1) 2}
@keyframes hop{40%{transform:translateY(-16px) rotate(6deg)}}
.ragi.think .ragi-bob{animation:tilt 1.6s ease-in-out infinite}
@keyframes tilt{50%{transform:rotate(-7deg)}}
.ragi.oops .ragi-bob{animation:wob .5s ease 2}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mouth-happy{display:none}.ragi.happy .mouth-happy{display:inline}.ragi.happy .mouth-idle{display:none}
.mouth-oops{display:none}.ragi.oops .mouth-oops{display:inline}.ragi.oops .mouth-idle{display:none}

/* Grain confetti */
.grain{position:fixed;width:8px;height:12px;border-radius:50%;background:var(--leaf);z-index:50;pointer-events:none}

/* Debrief */
.score-big{font-family:var(--display);font-weight:800;font-size:clamp(72px,18vw,140px);line-height:.9;color:var(--forest)}
.brk{display:grid;grid-template-columns:1fr 90px 54px;gap:10px;align-items:center;font-size:15px;margin:6px 0}
.brk .track{height:12px;background:var(--mist);border-radius:6px;overflow:hidden}
.brk .fill{height:100%;background:var(--leaf);width:0;transition:width 1s}
.brk b{font-family:var(--display);text-align:right}

.fade-in{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}

@media (max-width:600px){
  .top-inner{padding:8px 14px;gap:10px}
  .mark small{display:none}
  .group-q{font-size:18px;padding:10px 12px}
  .group .chips{padding:12px}
  .bins{grid-template-columns:1fr}
  .ragi-body{width:62px;height:78px}
  .bubble{font-size:14px}
  .hbar{grid-template-columns:90px 1fr 52px}
  main{padding-bottom:230px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .katori-fill{transform:scale(1)}
  .katori:not(.done) .katori-fill{transform:scale(0)}
  .tick.truth{transform:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="mark">Base Kitchen<small>SFS behavioural science capstone</small></div>
    <div class="thali" aria-label="Progress through the five acts">
      <svg viewBox="0 0 260 50" role="img" aria-hidden="true">
        <g id="katoris"></g>
      </svg>
    </div>
    <div class="score-chip" aria-live="polite"><span id="scoreNum">0</span></div>
  </div>
</header>

<main id="stage" tabindex="-1"></main>

<div class="ragi" id="ragi">
  <div class="bubble hide" id="bubble" role="status" aria-live="polite">
    <div class="who">Ragi</div>
    <div id="bubbleText"></div>
    <div class="bubble-actions">
      <button class="mini" id="hintBtn" type="button">Another hint</button>
      <button class="mini" id="hideBtn" type="button">Hide</button>
    </div>
  </div>
  <button class="ragi-body" id="ragiBody" type="button" aria-label="Ask Ragi for a hint">
    <svg viewBox="0 0 84 104">
      <g class="ragi-bob">
        <!-- stalk & leaves -->
        <path d="M42 100 C42 86 42 78 42 70" stroke="var(--forest)" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M42 88 C30 86 22 78 20 70 C31 72 39 78 42 88Z" fill="var(--leaf)"/>
        <path d="M42 82 C54 80 62 72 64 64 C53 66 45 72 42 82Z" fill="var(--leaf)"/>
        <!-- finger millet fingers -->
        <path d="M30 22 C24 12 22 6 24 2" stroke="var(--forest)" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path d="M42 18 C42 10 42 5 42 1" stroke="var(--forest)" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path d="M54 22 C60 12 62 6 60 2" stroke="var(--forest)" stroke-width="7" stroke-linecap="round" fill="none"/>
        <!-- head -->
        <ellipse cx="42" cy="46" rx="26" ry="28" fill="var(--leaf)" stroke="var(--ink)" stroke-width="2.5"/>
        <circle cx="30" cy="30" r="2" fill="var(--sprout)"/><circle cx="54" cy="31" r="2" fill="var(--sprout)"/>
        <circle cx="37" cy="24" r="1.6" fill="var(--sprout)"/><circle cx="48" cy="24" r="1.6" fill="var(--sprout)"/>
        <!-- face -->
        <ellipse class="eye" cx="33" cy="45" rx="3.6" ry="4.6" fill="#000"/>
        <ellipse class="eye" cx="51" cy="45" rx="3.6" ry="4.6" fill="#000"/>
        <circle cx="34.2" cy="43.4" r="1.2" fill="#fff"/><circle cx="52.2" cy="43.4" r="1.2" fill="#fff"/>
        <ellipse cx="26" cy="54" rx="4.5" ry="2.6" fill="var(--sprout)" opacity=".9"/>
        <ellipse cx="58" cy="54" rx="4.5" ry="2.6" fill="var(--sprout)" opacity=".9"/>
        <path class="mouth-idle" d="M37 55 Q42 59 47 55" stroke="#000" stroke-width="2.4" fill="none" stroke-linecap="round"/>

/* ---------- Ragi ---------- */

const HINTS = {

const GREET = {

/* ---------- navigation ---------- */

/* ---------- Act 1: Specify ---------- */
const A1 = [

/* ---------- Act 2: COM-B diagnosis ---------- */
const BOXES = [

const BUDGET = 100;
function trueEffect(levers, decay){
  const h = k => levers.has(k);
  const perm = h("circular"), sup = h("contract"), tr = h("training"), def = h("default"), ban = h("ban");
  let structural = 0, nudgy = 0;
  if (def) structural += 14 * (perm?1:.35) * (sup?1:.3) * (tr?1:.75);
  else structural += (perm?1.5:0) + (sup?1.5:0) + (tr?.8:0);
  if (ban) structural += 6 * (sup?1:.4);
  const avail = def || ban;
  if (h("names")) nudgy += 1.2;
  if (h("position")) nudgy += avail ? 1.8 : .8;
  if (h("scoop")) nudgy += .8;
  if (h("posters")) nudgy += .3;
  const d = decay ? .5 : 1;
  return structural * (decay ? .95 : 1) + nudgy * d;
}

  {k:"design",q:"Which design?",opts:[["prepost","Before and after, in the keenest kitchen"],["rct","Cluster RCT: 20 kitchens treated, 20 control"],["stepped","Stepped-wedge: 40 kitchens switch on in four waves"]]},
  {k:"prereg",q:"Pre-register the outcome and analysis?",opts:[["yes","Yes, before any data comes in"],["no","No, we'll see what the data shows"]]},
  {k:"follow",q:"How long do you follow up?",opts:[["2w","Two weeks"],["12w","Twelve weeks, with a withdrawal arm"]]}

function runPilot(){
  const a = S.act4;
  const eFull = trueEffect(S.levers, false), eDec = trueEffect(S.levers, true);
  const scale = eDec * .8;
  const comps = [["Voltage drop: delivery is weaker across 400 kitchens", eDec*.2]];
  let signal = eDec;
  if (a.follow === "2w"){ const nov = eFull*1.15 - eDec; comps.push(["Novelty: two weeks misses the decay", nov]); signal = eFull*1.15; }
  if (a.outcome === "reach") return {reach:true, scale, eDec, comps};
  let base = signal;
  if (a.outcome === "intent"){ const inf = 1.5*signal + 9; comps.push(["Measured intentions, not servings", inf]); base = signal + inf; }
  let noise, se, n;
  if (a.design === "prepost"){
    const sel = base * .5; comps.push(["Picked the keenest kitchen", sel]);
    comps.push(["Poshan Maah ran the same month, with no control group", 3]);
    base += sel + 3; se = 1.4; n = 1; noise = randn()*se;
  } else {
    se = a.design === "stepped" ? 1.1 : 1.6; n = 40;
    if (a.prereg === "no"){ let m = -Infinity; for (let i=0;i<5;i++) m = Math.max(m, randn()*se); noise = m; }
    else noise = randn()*se;
  }
  comps.push([a.prereg === "no" && a.design !== "prepost" ? "Chance, plus picking the best of five outcomes" : "Chance", noise]);
  const measured = base + noise;
  return {measured, se, n, scale, eDec, comps};
}

    <line x1="75" x2="145" y1="${Y(base)}" y2="${Y(base)}" stroke="var(--ink)" stroke-width="3"/>
    <line x1="215" x2="285" y1="${Y(base+r.measured)}" y2="${Y(base+r.measured)}" stroke="var(--ink)" stroke-width="3"/>
    <text x="110" y="202" text-anchor="middle" font-size="13" fill="var(--ink)">Control kitchens</text><text x="250" y="202" text-anchor="middle" font-size="13" fill="var(--ink)">Treated kitchens</text></svg>`;
}

/* ---------- Interlude: Dark patterns ---------- */
const DP = [
  {id:"d1",html:`<label style="display:flex;gap:8px;align-items:flex-start"><span style="border:2px solid var(--ink);border-radius:4px;width:16px;height:16px;flex-shrink:0;margin-top:2px;background:var(--ink)"></span><span>Add Zappit Gold, ₹49 a month</span></label>`,a:"dark",why:"A pre-ticked paid add-on works against the buyer's interest. That's a dark pattern (sneaking or preselection), not a nudge."},
  {id:"d2",html:`<b>Only 2 left!</b> Offer ends in 04:59`,a:"dark",why:"A fake countdown that resets on reload manufactures urgency. Dark pattern."},
  {id:"d3",html:`Swap chips for roasted makhana? Same price, one tap.`,a:"nudge",why:"Every option stays, the cost doesn't change, and the healthier choice gets easier. A nudge."},
  {id:"d4",html:`To cancel Gold, call 10 to 11 am on weekdays.`,a:"sludge",why:"Friction on a choice that's good for the user. Sludge."},
  {id:"d5",html:`Can you recognise every ingredient? Learn the 5-second label check.`,a:"boost",why:"It builds a skill the user keeps after the app is gone. A boost."},
  {id:"d6",html:`Most orders near you this week included a fresh vegetable.`,a:"nudge",why:"A true descriptive norm shown at the point of choice. A nudge. (Jansen et al. 2021 found norm messages alone didn't move online baskets much.)"}
];
const DCAT = [["nudge","Nudge"],["boost","Boost"],["sludge","Sludge"],["dark","Dark pattern"]];
R.darkpat = () => {
  stage.innerHTML = `
    <p class="act-tag">Interlude, about 3 minutes</p>
    <h2>Nudge, boost, sludge, or dark pattern?</h2>
    <p>A quick-commerce checkout, invented for this exercise. Tap each dashed part of the screen, then label it. The design moves that raise healthy choice also raise impulse buying.</p>
    <div class="phone-wrap">
      <div class="phone" aria-label="Mock checkout screen">
        <div class="phone-notch"></div>
        <div class="app-h">Zappit <span>Checkout</span></div>
        <div class="cartline"><span>Masala chips, 90 g</span><span>₹30</span></div>
        <div class="cartline"><span>Cold drink, 750 ml</span><span>₹45</span></div>
        <div id="pels"></div>
        <div class="fake-btn">Pay ₹124</div>
      </div>
      <div class="picker" id="picker"></div>
    </div>
    <div class="row"><button class="btn" id="check" disabled>Check my labels</button><button class="btn ghost" id="cont" hidden>Continue to Act 5</button></div>`;
  const draw = () => {
    const order = ["d2","d3","d6","d1","d5","d4"];
    $("#pels").innerHTML = order.map(id => { const d = DP.find(x=>x.id===id); const lab = S.dark[id];
      const cls = [S.darkSel===id?"sel":"", S.darkChecked?(lab===d.a?"right":"wrong"):""].join(" ");
      return `<button type="button" class="pel ${cls}" data-id="${id}">${d.html}${lab?`<span class="lbl">${DCAT.find(c=>c[0]===lab)[1]}</span>`:""}</button>`; }).join("");
    if (S.darkChecked){
      $("#picker").innerHTML = `<h3 style="margin-top:0">What each one was</h3>${DP.map(d=>`<p class="why">${d.why}</p>`).join("")}`;
    } else if (S.darkSel){
      $("#picker").innerHTML = `<h3 style="margin-top:0">Label this part</h3><div class="chips">${DCAT.map(([k,t])=>`<button type="button" class="chip" data-c="${k}" aria-pressed="${S.dark[S.darkSel]===k}">${t}</button>`).join("")}</div>`;
      $$("#picker .chip").forEach(b => b.onclick = () => { S.dark[S.darkSel] = b.dataset.c;
        const nxt = DP.find(d => !S.dark[d.id]); S.darkSel = nxt ? nxt.id : null; draw(); });
    } else {
      $("#picker").innerHTML = `<p class="meta">${Object.keys(S.dark).length === DP.length ? "All six labelled. Check them, or tap a part to change it." : "Tap a dashed part of the phone screen to label it."}</p>`;
    }
    $$(".pel").forEach(b => b.onclick = () => { if (S.darkChecked) return; S.darkSel = b.dataset.id; draw(); });
    $("#check").disabled = Object.keys(S.dark).length < DP.length || S.darkChecked;
  };
  $("#check").onclick = () => {
    S.darkChecked = true; S.darkSel = null; draw();
    const right = DP.filter(d => S.dark[d.id] === d.a).length;
    setScore("darkpat", right * 1.5);
    $("#check").hidden = true; $("#cont").hidden = false;
    if (right >= 5){ say(`${right} of 6. You can spot the difference between steering and tricking.`, "happy"); confetti(); }
    else say(`${right} of 6. The test: does it keep every option at the same cost, and does it serve the user?`, "oops");
  };
  $("#cont").onclick = next;
  draw();
};

/* ---------- Act 5: Pitch ---------- */
R.act5 = () => {
  const r = S.act4Run || {scale:trueEffect(S.levers,true)*.8, measured:null, se:1.6};
  const est = r.measured != null && !r.reach ? r.measured : r.scale;
  const ci = r.se ? (1.96*r.se).toFixed(1) : "1.5";
  const tonnes = Math.round(400*800*3*48*(Math.max(r.scale,0.5)/100)*0.08/1000);
  const sc = fmt(r.scale);
  const AUD = [
    {k:"sec",who:"The state secretary",what:"Political and fiscal gain, budget and scheme cycles, farmers",opts:[
      ["a",`Scaled across the zone, this lifts millet servings by about ${sc} points for the cost of one rate contract. Put it in this budget cycle and FPOs in your districts get a buyer for about ${tonnes} tonnes a year.`,true],
      ["b",`Our pilot shows millets can transform India's diets and help fight climate change.`,false],
      ["c",`The treatment effect was significant at the 5% level with standard errors clustered by kitchen.`,false]]},
    {k:"sci",who:"A peer scientist",what:"Transparent methods, credibility, limits",opts:[
      ["a",`A huge jump in millet love. Kitchens told us it worked really well!`,false],
      ["b",`${S.act4.design==="stepped"?"Stepped-wedge":S.act4.design==="rct"?"Cluster-randomised":"Pilot"} across ${r.n>1?"40 kitchens":"one kitchen"}, measured ${fmt(est)} pp; we'd expect about ${sc} pp at scale, and servings aren't intake.`,true],
      ["c",`Consistent with the literature, defaults raise uptake by around 80%.`,false]]},
    {k:"firm",who:"A company sourcing head",what:"Demand, cost, competitors, sourcing risk",opts:[
      ["a",`Millets are the future. Get on board or get left behind.`,false],
      ["b",`Help us save the planet by changing your recipe line.`,false],
      ["c",`If this scales, the zone buys roughly ${tonnes} more tonnes of millet flour a year through one rate contract, and the first supplier on it locks that demand in.`,true]]}
  ];
  const TT = {k:"tt",who:"The transparency test",what:"The default changes what diners get unless they ask. What goes up at the counter?",opts:[
    ["a","Nothing. Telling diners would weaken the effect.",false],
    ["b","A board reading \"Today's lunch: ragi mudde and dal. Rice on request.\"",true],
    ["c","A sign saying rice is out of stock today.",false]]};
  const all = [...AUD, TT];
  stage.innerHTML = `
    <p class="act-tag">Act 5 of 5, about 5 minutes</p>
    <h2>Make the case three ways</h2>
    <div class="brief"><p>Your pilot measured <b>${r.reach?"reach, not servings":fmt(est)+" pp"}</b>. Expected at scale: <b>${sc} pp</b> in millet servings. Pick the line you'd actually say to each person.</p></div>
    ${all.map(a=>`<div class="aud" data-k="${a.k}"><h3>${a.who}</h3><p class="meta">${a.what}</p>
      ${a.opts.map(([v,t])=>`<label class="opt" data-v="${v}"><input type="radio" name="${a.k}" value="${v}" ${S.act5[a.k]===v?"checked":""}><span>${esc(t)}</span></label>`).join("")}<div class="w"></div></div>`).join("")}
    <div class="row"><button class="btn" id="check" disabled>Check my lines</button><button class="btn ghost" id="cont" hidden>See how you did</button></div>`;
  const upd = () => $("#check").disabled = all.some(a => !S.act5[a.k]) || S.act5Checked;
  $$('input[type="radio"]').forEach(i => i.onchange = () => { S.act5[i.name] = i.value; upd(); });
  const WHY = {
    sec:"The secretary line gives one decision, a budget window and a farmer-income frame. The climate frame overclaims and speaks to the wrong motive; the clustered SEs are for a different room.",
    sci:"The scientist line states the design, the effect, the expected shrinkage, and what wasn't measured. The '80%' is exactly the headline-effect-size habit the deck warns about.",
    firm:"The firm line is about demand volume and first-mover position. Moral appeals don't move a sourcing head.",
    tt:"Only the honest board passes. Hiding the change fails the test; a fake stock-out is deception."
  };
  $("#check").onclick = () => {
    S.act5Checked = true; let pts = 0;
    all.forEach(a => {
      const box = $(`[data-k="${a.k}"]`), good = a.opts.find(o=>o[2])[0], ok = S.act5[a.k] === good;
      if (ok) pts += a.k === "tt" ? 2 : 3;
      $$(".opt", box).forEach(o => { if (o.dataset.v===good) o.classList.add("right"); else if (o.dataset.v===S.act5[a.k]) o.classList.add("wrong"); });
      $$("input", box).forEach(x=>x.disabled=true);
      $(".w", box).innerHTML = `<p class="why">${WHY[a.k]}</p>`;
    });
    setScore("act5", pts); complete("act5");
    $("#check").hidden = true; $("#cont").hidden = false;
    if (pts >= 9){ say("Same finding, three messengers' worth of framing, and nobody got tricked. Lovely.", "happy"); confetti(); }
    else say("Remember that stakeholders are behaving people too. Diagnose what each one needs before you draft.", "oops");
  };
  $("#cont").onclick = next;
  upd();
};

/* ---------- Debrief ---------- */
R.debrief = () => {
  const t = Math.round(total());
  const tier = t >= 80 ? "Ready to run a real trial" : t >= 60 ? "Solid. Tighten your measurement." : "Back to step 3 of the wheel";
  const h = k => S.levers.has(k);
  const a = S.act4;
  const CL = [
    [S.act1.who==="planner" && S.act1.what==="serve","Named the actor and the behaviour"],
    [(S.score.act2||0) >= 16,"Diagnosed with COM-B, with evidence"],
    [h("default") && !h("posters") && !h("influencer"),"Changed the options before the information"],
    [a.design && a.design !== "prepost","Tested where it would be scaled"],
    [a.prereg === "yes","Planned for small effects and registered the design"],
    [a.outcome === "servings","Measured behaviour, not reach or intentions"],
    [a.follow === "12w","Reported over time and watched for decay"],
    [!h("ban") && S.act5.tt === "b","Ran the transparency test"]
  ];
  const r = S.act4Run;
  stage.innerHTML = `
    <p class="act-tag">Debrief</p>
    <h2>${tier}</h2>
    <div class="score-big" id="bigScore">0</div>
    <p class="meta">out of 100</p>
    <div class="panel">
      ${Object.keys(MAX).map(k=>`<div class="brk"><span>${LABELS[k]}</span><div class="track"><div class="fill" data-w="${(S.score[k]||0)/MAX[k]*100}"></div></div><b>${Math.round(S.score[k]||0)}/${MAX[k]}</b></div>`).join("")}
    </div>
    <h3>The deck's checklist, against what you did</h3>
    <ul class="checklist">${CL.map(([ok,t])=>`<li class="${ok?"ok":""}">${t}</li>`).join("")}</ul>
    <h3>What was true in this world</h3>
    <p>The planner wasn't short of information, and neither were diners. Flour didn't arrive, a ₹8/kg gap sat in a frozen budget, planners didn't think they were allowed to change the menu, and cooks couldn't make millet mains for 800 at speed. A default only held when all three were fixed. Counter tweaks added a point or two and faded by week twelve. Posters and influencers did roughly nothing.</p>
    ${r ? `<p>Your plan moved servings by about <b>${fmt(r.scale)} pp</b> at scale, from a 4% baseline, against a best achievable of about ${fmt(BEST*.8)} pp. ${r.reach ? "Your pilot couldn't tell you that, because it counted views." : `Your pilot said ${fmt(r.measured)}.`}</p>` : ""}
    <p class="meta">Keep reading: Hallsworth 2023 for the overview, Michie, van Stralen and West 2011 for COM-B, DellaVigna and Linos 2022 for why effects shrink.</p>
    <div class="row"><button class="btn" id="again">Play again with a new world</button></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>$$(".brk .fill").forEach(f=>f.style.width=f.dataset.w+"%")));
  const big = $("#bigScore");
  if (reduced) big.textContent = t;
  else { let n = 0; const step = () => { n = Math.min(t, n + Math.max(1, Math.ceil((t-n)/8))); big.textContent = n; if (n < t) requestAnimationFrame(step); else if (t >= 60) confetti(30); }; requestAnimationFrame(step); }
  $("#again").onclick = () => { seed = Math.floor(Math.random()*1e9); rand = mulberry32(seed); fresh(); $("#scoreNum").textContent = "0"; go(0); };
};

/* ---------- boot ---------- */
render();
})();
</script>
</body>
</html>
