<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base Kitchen Host</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2228%22 fill=%22%233E8E41%22 stroke=%22%23000%22 stroke-width=%224%22/%3E%3Ccircle cx=%2224%22 cy=%2226%22 r=%224%22 fill=%22%23A8D5A2%22/%3E%3Ccircle cx=%2238%22 cy=%2236%22 r=%224%22 fill=%22%23A8D5A2%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/live.css">
<link rel="stylesheet" href="css/host.css">
<script>
  // Apply the saved theme before first paint so the projector doesn't flash.
  try { const t = localStorage.getItem("bk-host-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body class="host">
<div class="h-app" id="app">
  <header class="h-head" id="head">
    <div class="mark">Base Kitchen<small>Facilitator view</small></div>
    <div class="h-headroom" id="headRoom"></div>
    <div class="h-tools">
      <button class="btn ghost h-small" id="themeBtn" type="button">Dark mode</button>
    </div>
  </header>
  <main class="h-main" id="main" tabindex="-1"></main>
</div>
<p class="h-toast" id="toast" role="status" aria-live="polite"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script src="js/host.js"></script>
</body>
</html>
